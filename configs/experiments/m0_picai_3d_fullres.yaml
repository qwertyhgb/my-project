# LEGACY v2.2 PlainConv M0（保留用于审计/基础设施回归，不是 v2.3 正式 M0 配置）。
# v2.3 正式 M0 已改为 plan-driven Residual-Encoder 3D U-Net（P2A 已实现）；其版本化架构/实验配置见
# configs/architectures/m0_resenc_v23.yaml + configs/experiments/m0_resenc_picai_3d_fullres_v23.yaml（详见
# docs/P2_M0_ResidualEncoder_v23.md）。本文件所有配置值保持不变，仅供 legacy PlainConv 审计/回归。
# 不得使用本文件启动 v2.3 正式 G2 或正式训练，也不得原地覆盖为新架构配置。
# 旧 M0 基线：自研 nnU-Net-inspired 3D U-Net，T2W/ADC/HBV 普通 concat。
# 所有网络结构参数来自 workdir/nnUNet_preprocessed/Dataset605_PICAI/nnUNetPlans.json（3d_fullres），
# 本文件中的 patch/batch/architecture 必须与 plan 一致（加载时校验，冲突即报错）。
experiment:
  name: m0_picai_3d_fullres
  model_id: M0
  seed: 0
  fold: 0

paths:
  plans: workdir/nnUNet_preprocessed/Dataset605_PICAI/nnUNetPlans.json
  preprocessed_dataset: workdir/nnUNet_preprocessed/Dataset605_PICAI
  splits: workdir/nnUNet_preprocessed/Dataset605_PICAI/splits_final.json
  output_root: outputs/checkpoints/m0

model:
  in_channels: 3
  num_classes: 2
  deep_supervision: true
  configuration: 3d_fullres

data:
  modality_order: [T2W, ADC, HBV]
  batch_size: 2
  patch_size: [16, 320, 320]
  oversample_foreground: 0.33
  num_workers: 4
  pin_memory: true

# 增强：当前只实现"同步镜像"；pending_parity 是尚未对齐 nnU-Net 的增强清单（显式冻结，
# 正式 N0/M0 比较前必须补齐或作为明确实验差异记录；见 docs/P2_M0_Implementation.md）。
augmentation:
  mirror: true
  mirror_p_per_axis: 0.5
  per_channel_intensity: false
  pending_parity: [rotation, scaling, low_resolution_simulation, gaussian_noise, blur, gamma]

# 损失：与正式 N0 对齐（research_plan §9.2）
#   N0 = PI-CAI official-style nnU-Net v2 Focal+CE NoFFT
#   L = 0.5 × Focal(γ=2, α=None) + 0.5 × CE，逐 deep-supervision 尺度计算
# 迁移前 M0 使用 dice_ce（Dice + CE），两者不可做正式性能比较；本配置已迁移到 focal_ce。
loss:
  name: focal_ce
  focal_weight: 0.5
  ce_weight: 0.5
  gamma: 2.0
  smooth: 1.0e-05
  # 恒为 plan 值（仅用于 plan 一致性校验；focal_ce 下不代表损失项）
  batch_dice: false

optimizer:
  name: SGD
  lr: 0.01
  momentum: 0.99
  nesterov: true
  weight_decay: 3.0e-05

scheduler:
  name: PolyLR
  power: 0.9

training:
  # 200 为**初始上限**（不声称最优）；真实跑起来后按单个训练 epoch 与完整 validation epoch 的耗时再决定
  # 是否调整；不得依据外部 test 表现调整。
  max_epochs: 200
  iterations_per_epoch: 250
  # 仅用于 loader smoke / small-overfit 的诊断性随机 patch 验证，**不参与正式训练**
  diagnostic_validation_iterations: 50
  amp: true
  grad_clip: 12.0
  checkpoint_every: 50
  progress: true

validation:
  mode: full_volume
  # v2.2：正式 M0–M4 每 5 epoch 一次全体积验证（最后一个 epoch 即使不是 5 的倍数也必验证）；
  # 非验证 epoch 不调用 validator、不更新 best/patience，但 checkpoint_last/周期 checkpoint 仍保存。
  every_n_epochs: 5
  checkpoint_metric: val_positive_casewise_dice_mean
  maximize: true
  expected_cases: 223
  expected_positive_cases: 63
  expected_negative_cases: 160
  step_fraction: 0.5
  gaussian: true
  mirror_tta: false
  sliding_window_batch_size: 1
  inner_patch_progress: false
  save_case_metrics: true

# v2.2：正式 M0–M4 使用固定 200-epoch 预算，**禁用**“连续无改善”early stopping，
# 以保证所有模型与 seed 获得相同训练预算（research_plan §9.4）；只保留 NaN/Inf/覆盖病例数
# 错误等安全中止（由 validator/trainer 硬校验，不依赖本开关）。若今后显式启用（仅工程调试），
# patience 单位为 **validation event**（非 epoch），min_epochs 单位为 training epoch。
early_stopping:
  enabled: false
  min_epochs: 50
  patience: 8
  min_delta: 1.0e-4

inference:
  step_fraction: 0.5
  gaussian: true
  mirror_tta: false
