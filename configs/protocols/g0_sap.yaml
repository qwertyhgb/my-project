# G0-SAP 评测与统计分析计划（机器可读草案）
# 说明文档：docs/protocols/G0_SAP.md
#
# ── 生命周期与填写时点（v0.3；语义见 docs/protocols/G0_SAP.md §0.1）────────────────────────────
#   SAP-A（看任何模型预测之前）：
#     - 必须填写并冻结「方法」：阈值候选网格与选择指标、tie-break、共同/独立阈值规则、后处理候选、
#       picai_eval 版本与参数、统计与 bootstrap 规则、FROC 操作点、功效备忘录（含 MCID 与来源）、审阅与哈希；
#     - 用 `scripts/evaluate/prepare_g0_sap_freeze.py` 打印的方法块哈希填写
#       `sap_phases.sap_a.method_sha256`（算法：sha256(canonical_json(SAP_A_METHOD_PATHS))）；
#     - 然后才可把 `protocol.status` 与 `sap_phases.sap_a.status` 置为 FROZEN。
#   SAP-B（冻结 checkpoint 之后、最终 test 之前）：
#     - `sap_b_results` 的字段**有意保持 null**，直到在 PI-CAI validation 上按 SAP-A 既定算法一次性填写；
#     - **只写 `sap_b_results`**；不得改动本文件的 SAP-A 方法字段与 `power_memo`
#       （改动会使方法块哈希不一致 → 校验失败）。
#   SAP-C（封存 + 最终 test 一次性评估，属 G5）：
#     - 在 `sap_phases.sap_c.status=COMPLETED` 之前，`sees_final_test_predictions` 必须为 false
#       （不得查看最终 test 预测）。
#
# ⚠ 本文件中的 `null` 一律表示「尚未填写」；不得用假设值替代，也不得伪造阈值 / MDE / MCID 数值。
protocol:
  id: G0-SAP
  version: draft-0.3
  status: DRAFT            # DRAFT -> FROZEN；⚠ FROZEN 仅表示 SAP-A 方法冻结（SAP-B/SAP-C 见 sap_phases）
  created: "2026-09-15"
  reviewer: null
  frozen_at: null
  status_semantics: "protocol.status=FROZEN 仅表示 SAP-A 方法与候选集冻结；SAP-B/SAP-C 状态见 sap_phases"
  # ── 预测可见性（拆分字段；校验器强制与阶段状态一致）──────────────────────────────
  sees_validation_predictions: false   # SAP-A 必须 false；SAP-B COMPLETED 后置 true
  sees_final_test_predictions: false   # SAP-C COMPLETED 前必须 false
  sees_model_predictions: false        # 兼容字段：必须恒等于 sees_final_test_predictions（校验器强制）

sap_phases:                # G0-SAP 生命周期（方法与结果分离，见 research_plan §11.4）
  sap_a:                   # 看任何模型预测之前
    status: NOT_STARTED    # NOT_STARTED -> FROZEN
    method_sha256: null    # SAP-A 冻结时填写（由 prepare_g0_sap_freeze.py 打印，勿手算）
    method_sha256_algorithm: "sha256(canonical_json(SAP_A_METHOD_PATHS))"
    freeze_scope: [threshold_grid, selection_metric, tie_break_rule, threshold_policy,
                   connectivity_3d, min_lesion_volume, candidate_confidence,
                   picai_eval_params, statistics_methods, bootstrap_params,
                   froc_operating_points, power_memo]
    forbids: "不得使用任何 validation/test 数值做选择；不得查看任何模型预测"
  sap_b:                   # 冻结 checkpoint 之后、最终 test 之前
    status: NOT_STARTED    # NOT_STARTED -> COMPLETED
    allowed_inputs: [frozen_checkpoints, picai_validation]
    allowed_writes: [sap_b_results]
    forbids: "不得改动 SAP-A 方法字段与 power_memo；不得查看最终 test 预测"
  sap_c:                   # 封存 + 最终 test 一次性评估（属 G5）
    status: NOT_STARTED    # NOT_STARTED -> COMPLETED
    freeze_scope: [sealed_config_hashes, frozen_model_set]
    forbids: "评估后任何修改都使结果失去确认性资格"

# SAP-B 唯一允许写入的块（结果与审计）。全部为 null：等到冻结 checkpoint 后按 SAP-A 算法一次性填写。
sap_b_results:
  status: NOT_STARTED                # NOT_STARTED -> COMPLETED（COMPLETED 时必填字段须齐全）
  threshold_policy: null             # shared | per_model
  selected_foreground_threshold: null             # threshold_policy=shared 时必填
  selected_foreground_threshold_per_model: null   # threshold_policy=per_model 时必填：{model_id: value}
  selected_connectivity_3d: null
  selected_min_lesion_volume_mm3: null
  source_sap_a_config_sha256: null   # 必须等于 sap_phases.sap_a.method_sha256
  frozen_checkpoint_manifest_sha256: null
  validation_prediction_manifest_sha256: null
  selection_report_sha256: null
  sap_b_diff_audit_sha256: null      # SAP-A vs SAP-B 方法字段结构化差异审计文件哈希
  completed_at: null
  reviewer: null
  notes: null

endpoints:
  # ⚠ 命名语义（2026-09-17 新增；**不改变实现字段名**）：
  #   `val_positive_casewise_dice_mean` 是**训练期 checkpoint 指标**的实现字段名（由自研 validator 在
  #   validation event 上产出，因此带 `val_` 前缀），**不是最终 test 的终点名称**。
  #   最终 test 的语义终点（estimand）命名为 `positive_casewise_dice`：数学定义相同，但在冻结 test 上一次性评估。
  #   两者不得混用；重命名实现字段属待用户决定事项（research_plan §20.2 D5）。
  primary: val_positive_casewise_dice_mean     # 阳性患者 case-wise Dice（阳性=GT 含前景；预测为空记 0）
  primary_endpoint_semantics:
    checkpoint_metric_field: val_positive_casewise_dice_mean   # 实现/选模字段（硬冻结）
    final_test_estimand_name: positive_casewise_dice           # 语义终点名（论文报告用）
    definition: "阳性病例（GT 含前景体素）逐例完整体积 Dice 的算术平均；预测为空的阳性病例记 Dice=0"
    same_definition: true
    rename_requires_user_decision: true                        # research_plan §20.2 D5
  key_secondary:
    - lesion_average_precision
    - lesion_sensitivity_at_fp_per_exam
  negative_exam: [false_positive_case_rate, fp_per_exam]

checkpoint_selection:            # v2.2：训练侧选模规则（硬冻结；不得改用其他指标）
  rule: val_positive_casewise_dice_mean_max
  source: "research_plan §9.4（阳性病例 case-wise Dice 最大化；best 只在 validation event 产生）"
  forbid_alternatives: [val_micro_dice, val_loss, pseudo_dice]
  checkpoint_file: checkpoint_best.pth
  note: "最终推理与论文指标另有规则：N0 用 checkpoint_final.pth；自研模型按冻结评测配置"

case_level_metrics:              # v2.2：病例级指标口径（patient-level 聚合见 statistics）
  positive_casewise_dice:
    definition: "阳性病例（GT 含前景体素）逐例完整体积 Dice；阳性病例预测为空记 Dice=0"
    aggregation: "患者内阳性 study 先取算术平均，再对患者取算术平均（val_positive_casewise_dice_mean）"
    excludes: ["阴性病例不进入主 Dice 均值", "GT 与预测均为空不得记为 Dice=1"]
    ref: research_plan §11.1 / docs/P2_M0_Implementation.md §16.2
  negative_exam:
    metrics: [false_positive_case_rate, fp_per_exam]
    ref: research_plan §11.1

comparison_hierarchy:            # 按顺序执行；第 1 项不成立则不进入第 2 项
  - {id: M4_vs_M2, role: confirmatory_primary}
  - {id: M4_vs_M3, role: confirmatory_secondary, precondition: M4_vs_M2_positive}
confirmatory_data: "冻结最终 test（G0-E 路径 A 或 C）；validation 仅用于开发与方向性支持"

threshold_and_postprocessing:
  foreground_threshold:
    candidate_grid: null         # 冻结时写入（如 0.1–0.9 步长 0.05），并写明选择方法
    selection_metric: null       # 在 PI-CAI validation 上一次性选择
    tie_break_rule: null
  connectivity_3d: null          # 6/18/26 邻域与是否保留最大域（冻结时写入）
  min_lesion_volume:
    candidate_grid: null
    units: mm3
  candidate_confidence:
    aggregation: null            # 域内概率均值/最大值/其它（冻结时写入）
    segmentation_to_detection_map: null
  selection_scope: "only_PI-CAI_validation_once_then_fixed_for_all_models_and_tests"
  independent_threshold_per_model_allowed_only_if: "事先声明 + 对每个模型完全同规则执行"

detection_evaluation:
  library: picai_eval
  version: null                  # 冻结时写入并记录安装来源
  min_overlap: 0.1               # IoU >= 0.1（research_plan §11.4 默认口径）
  overlap_func: null
  split_merge_rule: null
  case_confidence_function: null
  ap_input: "candidate lesion continuous confidence（不得用某个 Dice 二值阈值后的固定预测作 AP 输入）"
  froc_operating_points: [0.5, 1.0, 2.0]   # FP/exam，主操作点（已冻结）
  froc_other_curves: supplementary_only

statistics:
  analysis_unit: patient_cluster
  multi_study_patient: "患者内阳性 study Dice 先取算术平均；阴性 study 只进入 FP 指标"
  paired_diff_per_seed: true
  main_effect: "3 个冻结 seed 的平均患者级配对差"
  bootstrap:
    type: paired_patient_cluster
    n_resamples: null            # 冻结时写入
    seed: null                   # 冻结时写入（可复现）
    ci: 0.95
  ci_interpretation: conditional_on_the_frozen_trained_seeds   # v2.2：不覆盖 seed 采样不确定度
  seed_reporting_required:
    - all_seed_specific_effects_with_patient_ci
    - cross_seed_mean_sd_range
    - single_dominant_seed_check
  seed_level_bootstrap:
    allowed_as: sensitivity_only
    disclaimer_required: "3 seeds insufficient to estimate seed distribution (esp. tails); not a strong confirmatory seed-level CI"
  ap_rule: "每个 bootstrap replicate 重采样患者及全部 study，在重构 cohort 上整体重算 AP 后取配对差；不得构造 per-case AP"
  lesion_froc_rule: "患者 cluster bootstrap；多病灶不视为独立样本"
  multiplicity_discipline: "主比较仅限 comparison_hierarchy；PZ/TZ、输入组合、其它指标为预声明的次级/探索性分析，不事后抬升"
  reproducibility_artifacts: [case_level_predictions, candidate_lesions, metrics, bootstrap_indices, bootstrap_seed, stats_config]

strata:                          # v2.2：统一分层定义（分层是“评价维度”，不是训练维度）
  zonal: [PZ, TZ, mixed, outside]
  rule_ref: research_plan §12.1
  thresholds:                    # 引用 §12.1 已冻结规则，不得事后改动
    zone_coverage_min: 0.5       # c_Z >= 0.5 才判定参考病灶属于 PZ/TZ
    dominance: 0.75              # q_PZ 或 q_TZ >= 0.75 → 单区病灶；否则 mixed/boundary
    sensitivity_alternatives: [0.67, 0.80]   # §12.1 预先声明的敏感性阈值
  note: "WG 派生分层与 PZ/TZ 分层共用同一实现；WG 仅用于分层/QC，不参与任何模型输入或采样"

seed_aggregation:                # v2.2：seed 汇总口径
  seeds: null                    # 冻结时写入 3 个冻结训练 seed（不得事后挑选）
  primary: mean_paired_diff
  report: [all_seed_specific_effects_with_patient_ci, cross_seed_mean_sd_range, single_dominant_seed_check]
  seed_level_ci: sensitivity_only
  disclaimer: "3 个 seed 不足以估计 seed 分布（尤其尾部）；主 CI 为 conditional on the frozen trained seeds"

power_memo:                      # G0-SAP 通过条件（见 docs/protocols/G0_SAP.md §5）
  status: INSUFFICIENT_DATA      # -> sufficient
  primary_endpoint: val_positive_casewise_dice_mean
  n_positive_patients: null
  assumed_paired_effect: null
  assumed_paired_sd: null
  sd_source: null                # 文献范围 / 盲态 nuisance estimate（必须写明）
  sd_sensitivity_range: null
  mde_95ci_width: null
  mcid: null                     # v2.3.1：最小实际/临床相关差异（必须写出来源；无法确立时写 INSUFFICIENT_DATA）
  mcid_source: null              # v2.3.1：文献范围 / 专家共识 / 盲态 pilot；不得用观察到的 M4 效果反推
  success_threshold: null        # 必须在看到正式模型结果前写下；主判定同时报告 CI 相对 mcid 的位置
  rules:
    - "不得用观察到的 M4 效果反向制定成功阈值"
    - "缺少可靠方差时只用文献范围或盲态估计，并做范围敏感性"
    - "外部样本量/语义不足时，看结果前降级为探索性验证"
    - "数据不足时保留字段并写 INSUFFICIENT DATA，不得伪造 MDE 数值"

one_shot_evaluation:
  frozen_models: [M2, M3, M4]    # 全部预定 seed 一并冻结后一次性评估
  rules:
    - "评估期间禁止调参、改后处理、选择更有利 seed/先验版本"
    - "test 结果用于任何模型/配置选择 -> 该数据失去测试资格"
    - "必须完整报告失败病例、置信区间与全部预定指标"

hash_binding:
  record_per_formal_run: [splits_sha256, manifest_sha256, plans_sha256, training_config, g0_r_preprocessing_identity, g0_sap_evaluation_config]
  mismatch_rule: "任一哈希不一致 -> 不得并入同一确认性比较"
  change_rule: "冻结后修改：①查看对应结果前完成 ②升版本 ③说明原因与影响 ④重记哈希；违反 -> 结果降级为探索性"

outputs:
  dir: outputs/metrics/evaluation
  files: [evaluation_config.sha256, stats_config.json, power_memo.md, main_results_tables, figures]
  record_fields: [inputs_with_hashes, outputs, protocol_version, script_version, picai_eval_version, status, reviewers, dates, sha256]

hashes: {}
