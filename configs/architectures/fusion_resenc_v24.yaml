# v2.4 融合家族架构配置：M1–M4 共用同一 Residual-Encoder 骨干 + 同一浅层分支/浅层 skip 契约。
#
# 与 `configs/architectures/m0_resenc_v23.yaml` 的关系：
#   - 骨干结构字段（n_stages/blocks_per_stage/features/kernel/stride/stem/shortcut/norm/nonlin/decoder/DS/
#     shallow_skip_contract/fusion_stage）与该文件**逐值一致**，保证 M0–M4 后端可比；
#   - v2.4 修正：gate 输入 = modality projection 输出 U_m（修正前读取投影前特征）；
#     M3 = 严格 Q([F_fuse,E_z])（修正前的实现隐式加了 F_fuse 残差）；
#     gate/conditioning 的 InstanceNorm3d 与 zone encoder 拓扑已写入声明（与实现逐值一致）；
#   - 本文件**额外**声明 `fusion_family`：M1–M4 的浅层三分支、modality projection、浅层 skip 聚合器、
#     image gate、zone encoder、conditioning、zone injection 的冻结定义；
#   - experiment 配置通过 `architecture.fusion_variant` 选择变体，解析后的单模型融合块进入
#     architecture_sha256 → M1/M2/M3/M4 的架构哈希**逐模型不同**（checkpoint/resume 无法跨模型加载）。
#
# 白名单纪律：本文件的 fusion_family 各字段只能声明 models/fusion_blocks.py 与
# models/fusion_multi_branch.py **实际实现**的取值；声明未实现值（例如改 gate 拓扑、改 zone encoder
# 宽度）会在加载时直接报错，不会静默生效。

architecture_name: fusion_resenc_picai_3d_fullres
architecture_version: v2.4
encoder_type: residual_encoder
block_type: basic_post_activation
activation_order: post_activation

n_stages: 7
blocks_per_stage: [1, 3, 4, 6, 6, 6, 6]
features_per_stage: [32, 64, 128, 256, 320, 320, 320]
kernel_sizes: [[1, 3, 3], [1, 3, 3], [3, 3, 3], [3, 3, 3], [3, 3, 3], [3, 3, 3], [3, 3, 3]]
strides: [[1, 1, 1], [1, 2, 2], [1, 2, 2], [2, 2, 2], [2, 2, 2], [1, 2, 2], [1, 2, 2]]

stem:
  type: stacked_conv_blocks
  n_convs: 1
  stride: [1, 1, 1]
  does_downsample: false

shortcut:
  identity_when: same_spatial_and_channels
  downsample_when: stride_change
  projection_when: channel_change
  downsample_op: avgpool3d_kernel_eq_stride
  downsample_before_projection: true
  projection_kernel: [1, 1, 1]
  projection_conv_bias: false
  projection_norm: true
  implicit_channel_crop_forbidden: true

normalization:
  op: InstanceNorm3d
  eps: 1.0e-5
  affine: true

nonlinearity:
  op: LeakyReLU
  negative_slope: 0.01
  inplace: true

conv_bias: true

initialization:
  method: he_kaiming_normal
  mode: fan_in
  nonlinearity: leaky_relu
  negative_slope: 0.01
  conv_bias_init: zeros
  norm_weight_init: ones
  norm_bias_init: zeros
  zero_init_last_norm_before_add: true

decoder:
  type: plain_unet_decoder
  upsample: convtranspose3d
  transpconv_kernel_equals_stride: true
  skip_align: center_crop_or_pad
  skip_merge: concat
  stage_block: stacked_conv_blocks
  n_conv_per_stage_decoder: [2, 2, 2, 2, 2, 2]
  per_level_seg_heads: true
  residual: false

deep_supervision:
  output_order: high_to_low_resolution
  weight_scheme: 1_over_2_pow_i
  lowest_resolution_weight_zero: true
  weights_normalized_to_one: true
  single_output_weight: 1.0

shallow_skip_contract:
  contract_id: shallow_skip.v23.concat_conv1x1_in_leakyrelu
  applies_to_stages: [0, 1]
  inputs:
    kind: modality_specific_encoder_features
    count: 3
    modality_order: [T2W, ADC, HBV]
  target_channels_source: plan.features_per_stage[stage]
  topology: [concat, conv1x1x1, instance_norm3d, leaky_relu]
  forbidden_inputs: [pz_tz, wg, sequence_gate_weight, sequence_logits, decoder_feature]
  produces_second_modality_logits: false
  stage2_skip: F_fuse
  stage3_and_deeper_skip: shared_encoder_skip
  identical_across_m1_m4: true

fusion_stage: 2
in_channels: 3
num_classes: 2

# ---------------------------------------------------------------------------------------
# M1–M4 融合家族（冻结定义；变体选择由 experiment.architecture.fusion_variant 声明）
# ---------------------------------------------------------------------------------------
fusion_family:
  family_id: fusion_resenc_v23

  modality_order: [T2W, ADC, HBV]

  # 三路结构相同、参数独立的浅层 residual 分支：从单模态输入编码到 fusion_stage(2)
  shallow_branch:
    stages: [0, 1, 2]
    stem_type: stacked_conv_blocks
    stem_n_convs: 1
    independent_parameters: true
    blocks_source: backbone_blocks_per_stage

  # 融合前逐模态 1×1×1 projection + IN + LeakyReLU（三路共用同一拓扑，参数独立）
  modality_projection:
    topology: [conv1x1x1, instance_norm3d, leaky_relu]
    per_modality: true

  # stage 0/1 浅层 skip：concat 三路 → 1×1×1 → IN → LeakyReLU；不读取 PZ/TZ/WG/gate
  shallow_skip_aggregation:
    topology: [concat, conv1x1x1, instance_norm3d, leaky_relu]
    stages: [0, 1]
    target_channels_source: plan.features_per_stage[stage]
    reads_only: modality_specific_stage_features

  variants:
    m1_equal:
      model_id: M1
      gate: null
      conditioning: null
      zone_encoder: null
      zone_injection: null

    m2_image_gate:
      model_id: M2
      gate:
        type: image_driven_softmax_over_modalities
        logits_source: modality_projection_outputs
        logits_topology: [conv1x1x1, instance_norm3d, leaky_relu, conv1x1x1]
        softmax_dim: modality
        weight_sum_to_one: true
        last_layer_zero_init: true
      conditioning: null
      zone_encoder: null
      zone_injection: null

    m3_zone_input:
      model_id: M3
      gate:
        type: image_driven_softmax_over_modalities
        logits_source: modality_projection_outputs
        logits_topology: [conv1x1x1, instance_norm3d, leaky_relu, conv1x1x1]
        softmax_dim: modality
        weight_sum_to_one: true
        last_layer_zero_init: true
      conditioning: null
      zone_encoder:
        input_channels: 2
        channel_semantics: [pz, tz]
        wg_forbidden: true
        n_blocks: 2
        features: 32
        kernel_size: [3, 3, 3]
        adapt: adaptive_avg_pool3d_to_fusion_stage
        stem_topology: [conv3d_same_padding, instance_norm3d, leaky_relu]
        block_type: residual_post_activation_basic
        block_topology: [conv3d_same_padding, instance_norm3d, leaky_relu, conv3d_same_padding, instance_norm3d, add_shortcut, leaky_relu]
        block_zero_init_last_norm: false
        shortcut: identity_or_avgpool_then_1x1x1_projection
        shared_between_m3_m4: true
      zone_injection:
        type: post_fusion_projection
        output: Q([F_fuse,E_z])
        topology: [concat, conv1x1x1, instance_norm3d, leaky_relu]
        enters: shared_feature_after_fusion
        implicit_residual: false
        enters_gate: false
        enters_shallow_skip: false

    m4_conditioned_gate:
      model_id: M4
      gate:
        type: image_driven_softmax_over_modalities
        logits_source: modality_projection_outputs
        logits_topology: [conv1x1x1, instance_norm3d, leaky_relu, conv1x1x1]
        softmax_dim: modality
        weight_sum_to_one: true
        last_layer_zero_init: true
      conditioning:
        type: bounded_conditional_affine
        formula: "(1 + tanh(gamma)) * L_img + beta"
        gamma_activation: tanh
        head_topology: [conv1x1x1, instance_norm3d, leaky_relu, conv1x1x1]
        head_last_layer_zero_init: true
        spatial: true
        enters_gate: true
        enters_shallow_skip: false
        enters_decoder_directly: false
      zone_encoder:
        input_channels: 2
        channel_semantics: [pz, tz]
        wg_forbidden: true
        n_blocks: 2
        features: 32
        kernel_size: [3, 3, 3]
        adapt: adaptive_avg_pool3d_to_fusion_stage
        stem_topology: [conv3d_same_padding, instance_norm3d, leaky_relu]
        block_type: residual_post_activation_basic
        block_topology: [conv3d_same_padding, instance_norm3d, leaky_relu, conv3d_same_padding, instance_norm3d, add_shortcut, leaky_relu]
        block_zero_init_last_norm: false
        shortcut: identity_or_avgpool_then_1x1x1_projection
        shared_between_m3_m4: true
      zone_injection: null

provenance:
  plans_name: nnUNetPlans
  configuration: 3d_fullres
  plan_source: workdir/nnUNet_preprocessed/Dataset605_PICAI/nnUNetPlans.json
  backbone_source: configs/architectures/m0_resenc_v23.yaml（骨干字段逐值一致）
  blocks_per_stage_source: >-
    official nnU-Net ResEnc-M preset: ResEncUNetPlanner.UNet_blocks_per_stage_encoder=(1,3,4,6,6,6,6,...)
  equivalence_note: >-
    M1–M4 与 M0 共用同一 Residual-Encoder 后半段、普通 decoder、损失与训练设置；
    差异只在输入到 fusion_stage 的浅层路径与 stage 2 融合方式。gate 权重只是结构量，
    不得解释为因果贡献。
